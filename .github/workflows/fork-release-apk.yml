# Fork-only: builds an UNSIGNED FOSS release APK of this branch (signed locally afterwards).
# No secrets, no release, no deploy.
name: Unsigned release APK (fork CI)
on:
  push:
    branches: [ ci-release-v2.0.0 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'
      - name: FOSS build, empty local.properties
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties
          touch ./local.properties
      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions
      - name: Unit test VocalRemover
        run: ./gradlew :aiService:jvmTest
      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease
      - run: ls -la androidApp/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: androidApp/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 3
